<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div> 
        <aside class = "topbar"> 
            <header class="heading">
                <h1>My Task Manager</h1>
            </header>
            <nav> 
                <button id = "allTasksButton">All Tasks</button>
                <button id = "todayButton">Today</button>
                <button id = "upcomingButton">Upcoming</button>
                <button id = "completedButton">Completed</button>  
                <button id = "dailyButton">Daily</button>
                <button id = "reminderButton">Reminders</button> 
                <button id = "statButton">Statistics</button>
            </nav>  
        </aside> 
        <div class = "add-task-bar">
            <div class = "add-task-heading"> 
                <h2>Add a Task</h2> 
                <div id = "dailyCheck" class = "task-card"> 
                    <label for = "dailyTask">Daily Task:</label>
                    <label class = "switch"> 
                        <input type = "checkbox" id = "dailyTask"> 
                        <span class = "slider"></span>
                    </label>
                </div>
            </div>
            <input type="text" id="taskInput" placeholder="Enter a task">
            <input id = "taskDate" type = "date"> 
            <input id = "priorityTasks" type = "number" min = "1" max = "7"> 
            <button id="addButton">Add Task</button>
        </div>
        <div class = "todayTaskHeader">
            <h2 id = "tasksHeader">All Tasks:</h2> 
            <div> 
                <label for = "sortTasks">Sort by:</label>
                <select class = "heading-dropdown" id = "sortTasks"> 
                        <option value = "priority">Priority</option>   
                        <option value = "date">Due Date</option>
                        <option value = "alphabetical">Alphabetical</option>
                </select>
            </div> 
        </div>
        <div class = "tasks-sub-heading" id = "taskList"> 
            <script src="script.js"></script>
        </div>
        <ul id="taskList"></ul>
    <div> 
</body>
</html>
